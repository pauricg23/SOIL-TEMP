; PlatformIO Project Configuration File for Walter Board (ESP32-S3)
; Compost Sensor with 3x DS18B20, LTE-M connectivity

[env:walter-esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.flash_freq = 80m
board_build.flash_size = 16MB
board_build.psram_type = qspi

; set this to your actual port (PlatformIO sidebar → Devices)
; upload_port = /dev/ttyACM0
; upload_port = COM5
; upload_port = /dev/cu.usbmodemXXXX
upload_port = /dev/cu.usbmodem211201

board_build.cpp_std = gnu++17
build_flags = 
    -DCORE_DEBUG_LEVEL=4
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Iinclude
    -include include/esp_vfs_fat_compat.h

lib_deps = 
    https://github.com/QuickSpot/walter-arduino.git
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^4.0.5

; Build everything except the temporary enable finder sketch
build_src_filter = +<*> -<enable_finder.cpp>
